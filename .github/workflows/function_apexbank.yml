# Build and deploy Azure Function App from the azure-function folder.
# Separate from the web app deployment workflow.

name: Build and deploy Azure Function App - apexbank

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install and test function dependencies
        working-directory: ./azure-function
        run: |
          npm install
          npm test --if-present

      - name: Upload function artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-app
          path: azure-function

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: function-app

      - name: Deploy Azure Function App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'apexbank'
          slot-name: 'Production'
          package: azure-function
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_APEXBANK }}
